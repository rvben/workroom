name: Dependency health

on:
  schedule:
    - cron: "48 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@e43776bc09ba8dfd7f0e6108eaf37c153b061ada # v0.18.4
    with:
      langs: node,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: npm ci
      validation-command: npm run check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
      auto-merge: true
      merge-method: squash
      allowed-paths: >-
        .github/workflows/*.yaml
        .github/workflows/*.yml
        package-lock.json
        package.json
