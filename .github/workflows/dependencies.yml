name: Dependency health

on:
  schedule:
    - cron: "48 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@26b08c6b4c6b9ec106894394895eea05111738a5 # v0.15.1
    with:
      langs: node,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: npm ci
      validation-command: npm run check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
